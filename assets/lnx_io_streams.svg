<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="sans-serif">
  <rect width="780" height="300" rx="16" fill="#0f1420"/>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa4b2"/></marker></defs>
  <text x="40" y="48" font-size="20" fill="#8b98a9">Every process has three standard streams</text>
  <rect x="305" y="120" width="180" height="84" rx="12" fill="#16305a" stroke="#61afef" stroke-width="2"/>
  <text x="395" y="168" text-anchor="middle" font-size="22" fill="#e6edf3" font-family="ui-monospace,monospace">command</text>
  <text x="60" y="150" font-size="16" fill="#98c379" font-family="ui-monospace,monospace">stdin (0)</text>
  <line x1="150" y1="162" x2="303" y2="162" stroke="#98c379" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="628" y="138" font-size="16" fill="#61afef" font-family="ui-monospace,monospace">stdout (1)</text>
  <line x1="487" y1="146" x2="720" y2="146" stroke="#61afef" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="628" y="200" font-size="16" fill="#e06c75" font-family="ui-monospace,monospace">stderr (2)</text>
  <line x1="487" y1="184" x2="720" y2="184" stroke="#e06c75" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="40" y1="238" x2="740" y2="238" stroke="#23293a" stroke-width="1"/>
  <text x="60" y="272" font-size="15" fill="#8b98a9" font-family="ui-monospace,monospace">cmd &lt; in.txt      # feed stdin        cmd &gt; out.txt 2&gt; err.txt   # split stdout &amp; stderr</text>
</svg>
