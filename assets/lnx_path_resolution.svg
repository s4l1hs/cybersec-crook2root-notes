<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="sans-serif">
  <rect width="800" height="250" rx="16" fill="#0f1420"/>
  <defs><marker id="p" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa4b2"/></marker></defs>
  <text x="40" y="44" font-size="20" fill="#8b98a9">How the shell resolves a bare command — <tspan fill="#e6edf3" font-family="ui-monospace,monospace">$PATH</tspan> searched left → right</text>
  <text x="40" y="86" font-size="16" font-family="ui-monospace,monospace" fill="#e6edf3">$ ls</text>
  <g font-family="ui-monospace,monospace" font-size="15">
    <rect x="40"  y="110" width="150" height="52" rx="9" fill="#3a2330" stroke="#e06c75"/>
    <text x="115" y="134" text-anchor="middle" fill="#e06c75">/tmp</text>
    <text x="115" y="152" text-anchor="middle" fill="#d3a1b0" font-size="12">attacker-writable!</text>
    <rect x="220" y="110" width="170" height="52" rx="9" fill="#16223a" stroke="#3d5a80"/>
    <text x="305" y="140" text-anchor="middle" fill="#9db4d0">/usr/local/bin</text>
    <rect x="420" y="110" width="150" height="52" rx="9" fill="#14351a" stroke="#51cf66"/>
    <text x="495" y="134" text-anchor="middle" fill="#d3f9d8">/usr/bin</text>
    <text x="495" y="152" text-anchor="middle" fill="#9ad3a8" font-size="12">the real ls</text>
    <line x1="190" y1="136" x2="218" y2="136" stroke="#9aa4b2" stroke-width="2" marker-end="url(#p)"/>
    <line x1="390" y1="136" x2="418" y2="136" stroke="#9aa4b2" stroke-width="2" marker-end="url(#p)"/>
  </g>
  <line x1="40" y1="188" x2="760" y2="188" stroke="#23293a"/>
  <text x="40" y="220" font-size="14" fill="#8b98a9">Prepend a writable dir (<tspan font-family="ui-monospace,monospace" fill="#e06c75">export PATH=/tmp:$PATH</tspan>) and a planted <tspan font-family="ui-monospace,monospace">ls</tspan> wins the search — run by a root job = privesc.</text>
</svg>
