<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="780" height="300" rx="16" fill="#0f1420"/>
  <text x="40" y="50" font-size="20" font-family="sans-serif" fill="#8b98a9">Permission string anatomy — <tspan fill="#e6edf3" font-weight="bold">chmod 754 file</tspan></text>
  <text x="60"  y="140" font-size="58" fill="#f2b134">-</text>
  <text x="150" y="140" font-size="58" fill="#e06c75">rwx</text>
  <text x="340" y="140" font-size="58" fill="#61afef">r-x</text>
  <text x="530" y="140" font-size="58" fill="#98c379">r--</text>
  <g font-family="sans-serif">
    <text x="52"  y="180" font-size="17" fill="#f2b134">type</text>
    <text x="150" y="180" font-size="17" fill="#e06c75">owner</text>
    <text x="340" y="180" font-size="17" fill="#61afef">group</text>
    <text x="530" y="180" font-size="17" fill="#98c379">others</text>
    <text x="150" y="212" font-size="30" font-weight="bold" fill="#e06c75">7</text>
    <text x="340" y="212" font-size="30" font-weight="bold" fill="#61afef">5</text>
    <text x="530" y="212" font-size="30" font-weight="bold" fill="#98c379">4</text>
  </g>
  <line x1="40" y1="238" x2="740" y2="238" stroke="#23293a" stroke-width="1"/>
  <text x="60" y="272" font-family="sans-serif" font-size="15" fill="#8b98a9">r = 4 (read)  ·  w = 2 (write)  ·  x = 1 (execute)   →   rwx = 4+2+1 = <tspan fill="#e06c75">7</tspan>   ·   r-x = 4+0+1 = <tspan fill="#61afef">5</tspan>   ·   r-- = 4+0+0 = <tspan fill="#98c379">4</tspan></text>
</svg>
